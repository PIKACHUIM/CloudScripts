name: Deploy Docs + Assets to Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'Linux/**'
      - 'WinNT/**'
      - 'Menu.sh'
      - 'CNAME'
      - '.pika-healthz'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build VitePress docs
        run: |
          cd docs
          npm ci
          npm run docs:build

      - name: Prepare deploy directory
        run: |
          # Start with VitePress output as base
          cp -r docs/.vitepress/dist _site

          # Custom domain
          cp CNAME _site/

          # Health check probe
          cp .pika-healthz _site/ 2>/dev/null || printf 'OK' > _site/.pika-healthz

          # Mirror raw scripts at site root (backward compatible CDN paths)
          # pikash.opkg.cn/Linux/Desktop/xxx.sh → works without /raw/ prefix
          cp -r Linux/Desktop/    _site/Linux/Desktop/    2>/dev/null || true
          cp -r Linux/VPSTest/    _site/Linux/VPSTest/    2>/dev/null || true
          cp -r Linux/Lib/        _site/Linux/Lib/        2>/dev/null || true
          cp -r Linux/Modules/    _site/Linux/Modules/    2>/dev/null || true
          cp -r Linux/I18n/       _site/Linux/I18n/       2>/dev/null || true
          cp    Linux/VPSSets/    _site/Linux/VPSSets/    2>/dev/null || true
          cp    Linux/Tunnels/    _site/Linux/Tunnels/    2>/dev/null || true
          cp Menu.sh              _site/
          cp README.MD            _site/
          cp CONTRIBUTING.md      _site/                  2>/dev/null || true
          cp THIRD_PARTY_NOTICES.md _site/                2>/dev/null || true
          cp -r WinNT/            _site/WinNT/            2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

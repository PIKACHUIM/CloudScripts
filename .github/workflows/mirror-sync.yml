name: Mirror Sync (Assets Branch)

on:
  schedule:
    - cron: '0 2 * * *'   # Daily at 02:00 UTC
  workflow_dispatch:        # Manual trigger

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout assets branch (orphan)
        uses: actions/checkout@v4
        with:
          ref: assets
          path: assets
          # If assets branch doesn't exist yet, create it below

      - name: Ensure assets branch exists
        working-directory: assets
        run: |
          if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
            git checkout --orphan assets
            git rm -rf --quiet . || true
            git commit --allow-empty -m "Init assets branch"
          fi

      - name: Sync VPSTest assets from upstream
        working-directory: assets
        run: |
          # ---- ecss-bench (SpiritLHL's ecs) ----
          mkdir -p ecss-bench
          curl -fsSL -o ecss-bench/ecs.sh \
            "https://raw.githubusercontent.com/spiritLHLS/ecs/main/ecs.sh" || true
          curl -fsSL -o ecss-bench/ipcheck.sh \
            "https://raw.githubusercontent.com/spiritLHLS/ecs/main/ipcheck.sh" || true
          curl -fsSL -o ecss-bench/media_lmc_check.sh \
            "https://raw.githubusercontent.com/spiritLHLS/ecs/main/media_lmc_check.sh" || true
          curl -fsSL -o ecss-bench/ecsspeed-ping.sh \
            "https://raw.githubusercontent.com/spiritLHLS/ecs/main/ecsspeed-ping.sh" || true
          curl -fsSL -o ecss-bench/ZBench-CN.sh \
            "https://raw.githubusercontent.com/spiritLHLS/ecs/main/ZBench-CN.sh" || true
          curl -fsSL -o ecss-bench/gostun_install.sh \
            "https://raw.githubusercontent.com/spiritLHLS/ecs/main/gostun_install.sh" || true
          curl -fsSL -o ecss-bench/backtrace_install.sh \
            "https://raw.githubusercontent.com/spiritLHLS/ecs/main/backtrace_install.sh" || true
          curl -fsSL -o ecss-bench/multi_disk_io_test.sh \
            "https://raw.githubusercontent.com/spiritLHLS/ecs/main/multi_disk_io_test.sh" || true
          curl -fsSL -o ecss-bench/nexttrace.sh \
            "https://raw.githubusercontent.com/spiritLHLS/ecs/main/nexttrace.sh" || true

          # ---- YABS (Mason Rowe, MIT) ----
          mkdir -p yabs-bench
          curl -fsSL -o yabs-bench/yabs.sh \
            "https://raw.githubusercontent.com/masonr/yet-another-bench-script/master/yabs.sh" || true

          # ---- UnixBench (Teddysun) ----
          mkdir -p unix-bench
          curl -fsSL -o unix-bench/unixbench.sh \
            "https://raw.githubusercontent.com/teddysun/across/master/unixbench.sh" || true

          # ---- Place healthz probe ----
          echo "PIKA_SH_OK" > .pika-healthz
          echo "version=1.0" >> .pika-healthz
          echo "mirror=benchs.pika.net.cn" >> .pika-healthz

      - name: Commit & push assets changes
        working-directory: assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "sync: daily assets update $(date -u +%Y-%m-%d)"
            git push origin assets
          else
            echo "No changes, skipping commit."
          fi

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[CI] Mirror sync failed on ' + new Date().toISOString().slice(0,10),
              body: 'Daily mirror sync workflow failed. Please check the [Actions log](' + process.env.GITHUB_SERVER_URL + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ').'
            });
